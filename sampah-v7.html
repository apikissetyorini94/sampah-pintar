// Penyimpanan data hasil tarikan sheet + status koneksi
const SHEETS = {};
let sheetsStatus = "idle"; // idle | loading | done

function toNum(v){ if(v==null)return v; const n=parseFloat(String(v).replace(/\./g,"").replace(",",".")); return isNaN(n)?v:n; }
function mapRows(rawRows, cfg){
  return rawRows.map(raw=>{
    const o={};
    for(const [col,field] of Object.entries(cfg.map)){
      let val = raw[col];
      if(cfg.numFields && cfg.numFields.includes(field)) val = toNum(val);
      o[field] = (val==null?"":val);
    }
    return o;
  }).filter(o=>Object.values(o).some(v=>String(v).trim()!==""));
}
function fetchTab(cfg){
  return new Promise((resolve)=>{
    const url=`https://docs.google.com/spreadsheets/d/${CONFIG.SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(cfg.tab)}`;
    Papa.parse(url,{ download:true, header:true, skipEmptyLines:true,
      complete:res=>{ try{ resolve(mapRows(res.data,cfg)); }catch(e){ resolve(null); } },
      error:()=>resolve(null) });
  });
}
async function loadSheets(){
  if(!CONFIG.SPREADSHEET_ID || sheetsStatus==="loading") return;
  const first = sheetsStatus==="idle";
  sheetsStatus="loading";
  const keys=Object.keys(SHEET_MAP);
  const results=await Promise.all(keys.map(k=>fetchTab(SHEET_MAP[k])));
  keys.forEach((k,i)=>{ if(Array.isArray(results[i]) && results[i].length) SHEETS[k]=results[i]; });
  // Terapkan pengaturan (mis. link kebijakan)
  if(SHEETS.pengaturan){
    const row=SHEETS.pengaturan.find(r=>r.kunci==="kebijakan_url");
    if(row && row.nilai) LINKS.kebijakan=row.nilai;
  }
  sheetsStatus="done";
  render();
}

function sourceNote(key, tab){
  if(usingSheet(key)) return `<div class="src-note ok">${icon("check",12,2.4)} Sumber: Google Sheets — tab "${tab}"</div>`;
  if(CONFIG.SPREADSHEET_ID && sheetsStatus!=="done") return `<div class="src-note">Memuat data dari Google Sheets…</div>`;
  return `<div class="src-note">${icon("alert",12,2.4)} Data contoh — atur CONFIG.SPREADSHEET_ID & isi tab "${tab}" untuk data asli</div>`;
}

async function loadSampah(){
  if(state.sampah.status==="loading") return;
  state.sampah={...state.sampah, status:"loading"}; render();
  try{
    const r = await fetch("/api/sampah");
    if(!r.ok){
      let msg="HTTP "+r.status;
      try{ const j=await r.json(); if(j.error) msg=j.error+(j.detail?" — "+j.detail:""); }catch(_){}
      throw new Error(msg);
    }
    const rows = await r.json();
    if(!Array.isArray(rows)) throw new Error("Format data tidak sesuai (bukan array).");
    state.sampah={status:"ready", rows, demo:false, err:null};
  }catch(e){
    // Fallback: tampilkan data contoh agar tata letak tetap terlihat sebelum deploy.
    state.sampah={status:"ready", rows:SAMPAH_DEMO, demo:true, err:e.message};
  }
  render();
}

/* ---------- KALENDER LINGKUNGAN ---------- */
function calMove(delta){
  let m=state.calMonth+delta, y=state.calYear;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  state.calMonth=m; state.calYear=y; render();
}
function eventsFor(monthIdx){
  return KALENDER.filter(e=>e.m===monthIdx+1).sort((a,b)=>a.d-b.d);
}
function calendarWidget(){
  const m=state.calMonth, y=state.calYear;
  const first=new Date(y,m,1).getDay();      // 0=Min
  const days=new Date(y,m+1,0).getDate();
  const evs=eventsFor(m);
  const evByDay={};
  evs.forEach(e=>{ (evByDay[e.d]=evByDay[e.d]||[]).push(e); });
  const today=new Date();
  const isThisMonth = today.getFullYear()===y && today.getMonth()===m;

  let cells="";
  for(let i=0;i<first;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const ev=evByDay[d];
    const isToday = isThisMonth && today.getDate()===d;
    let cls="cal-cell";
    let dotHtml="";
    if(ev){
      const hasNas=ev.some(x=>x.tingkat==="Nasional");
      const hasInt=ev.some(x=>x.tingkat==="Internasional");
      cls+=" has-ev";
      dotHtml=`<div class="cal-dots">${hasNas?'<span class="cd" style="background:#C98A2B"></span>':''}${hasInt?'<span class="cd" style="background:#2C6E63"></span>':''}</div>`;
    }
    if(isToday) cls+=" today";
    const title = ev ? ev.map(x=>x.nama).join(" • ").replace(/"/g,'&quot;') : "";
    cells+=`<div class="${cls}" ${ev?`title="${title}"`:""}><span class="cal-num">${d}</span>${dotHtml}</div>`;
  }

  const evList = evs.length ? evs.map(e=>`
    <div class="cal-ev-row">
      <div class="cal-ev-date">${String(e.d).padStart(2,'0')} ${MONTHS[m]}</div>
      <div class="cal-ev-body">
        <div class="cal-ev-name">${e.nama}</div>
        <span class="cal-ev-tier" style="background:${e.tingkat==='Nasional'?'#F6EBD8':'#E4EFE8'};color:${e.tingkat==='Nasional'?'#C98A2B':'#2C6E63'}">${icon(e.tingkat==='Nasional'?'flag':'globe',10,2)} ${e.tingkat}</span>
      </div>
    </div>`).join("") : `<div class="cal-empty">Tidak ada peringatan lingkungan bulan ini.</div>`;

  return `
    <div class="panel cal-panel">
      <h3>${icon("calendar",15)} Kalender Lingkungan Hidup ${y}</h3>
      <div class="cal-layout">
        <div class="cal-left">
          <div class="cal-head">
            <button class="cal-nav" onclick="calMove(-1)">${icon("chevL",16,2.2)}</button>
            <div class="cal-title">${MONTH_FULL[m]} ${y}</div>
            <button class="cal-nav" onclick="calMove(1)">${icon("chevR",16,2.2)}</button>
          </div>
          <div class="cal-grid cal-dow">${DOW.map(d=>`<div class="cal-dowcell">${d}</div>`).join("")}</div>
          <div class="cal-grid">${cells}</div>
          <div class="cal-legend">
            <span class="li"><span class="cd" style="background:#C98A2B"></span>Nasional</span>
            <span class="li"><span class="cd" style="background:#2C6E63"></span>Internasional</span>
            <span class="li"><span class="cd ring"></span>Hari ini</span>
          </div>

/* ---------- PENGELOLAAN SAMPAH ---------- */
function analyzeSampah(rows){
  if(!rows.length) return {cols:[], dateCol:null, weightCol:null, catCol:null, locCol:null, statusCol:null};
  const cols=Object.keys(rows[0]).filter(c=>c!=="id");
  const isNum=c=>rows.some(r=>typeof r[c]==="number" || (r[c]!=null && r[c]!=="" && !isNaN(parseFloat(r[c]))));
  const dateCol = cols.find(c=>/tanggal|date|waktu|created/i.test(c)) || null;
  const weightCol = cols.find(c=>/(berat|volume|massa|jumlah|kg|qty|kuantitas|bobot)/i.test(c) && isNum(c)) || null;
  const catCol = cols.find(c=>/(jenis|kategori|tipe|type|category|klasifikasi|golongan)/i.test(c)) || null;
  const locCol = cols.find(c=>/(lokasi|gardu|unit|tempat|site|area|sumber)/i.test(c)) || null;
  const statusCol = cols.find(c=>/(status|kondisi|keadaan)/i.test(c)) || null;
  return {cols, dateCol, weightCol, catCol, locCol, statusCol};
}
function snum(v){ const n=typeof v==="number"?v:parseFloat(v); return isNaN(n)?0:n; }
function monthKey(v){ const d=new Date(v); if(isNaN(d))return null; return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }

function sampah(){
  const s=state.sampah;
  if(s.status==="idle"){ setTimeout(loadSampah,10); return {html:sampahShell(`<div class="empty">Memuat data pengelolaan sampah…</div>`), draw:()=>{}}; }
  if(s.status==="loading"){ return {html:sampahShell(`<div class="empty">Memuat data pengelolaan sampah…</div>`), draw:()=>{}}; }

  const rows=s.rows||[];
  const A=analyzeSampah(rows);
  const banner = s.demo
    ? `<div class="note">${icon("alert",15,2)}<div><b>Mode Pratinjau — data contoh.</b> Dashboard belum menarik data asli dari <code>/api/sampah</code>${s.err?` (${escapeHtml(s.err)})`:""}. Ini normal bila file dibuka langsung atau environment variable Supabase di Vercel belum di-set. Setelah deploy & konfigurasi benar, data asli otomatis tampil di sini.</div></div>`
    : `<div class="note ok">${icon("recycle",15,2)}<div>Tersambung ke Supabase — menampilkan ${rows.length} catatan sampah terbaru.</div></div>`;

  if(!rows.length) return {html:sampahShell(banner+`<div class="table-wrap"><div class="empty">Belum ada catatan sampah pada database.</div></div>`), draw:()=>{}};

  const totalBerat = A.weightCol ? rows.reduce((a,r)=>a+snum(r[A.weightCol]),0) : null;
  const dates = A.dateCol ? rows.map(r=>new Date(r[A.dateCol])).filter(d=>!isNaN(d)) : [];
  const minD = dates.length?new Date(Math.min(...dates)):null, maxD=dates.length?new Date(Math.max(...dates)):null;
  const cats = A.catCol ? [...new Set(rows.map(r=>r[A.catCol]).filter(x=>x!=null&&x!==""))] : [];
  const fmtD = d=>d?d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"–";

  const kpis=[{ic:"box",c:"#2C6E63",v:rows.length,l:"Total Catatan Sampah",sub:A.dateCol?`${fmtD(minD)} – ${fmtD(maxD)}`:""}];
  if(totalBerat!=null) kpis.push({ic:"recycle",c:"#C98A2B",v:fmt1(totalBerat),l:`Total ${A.weightCol.replace(/_/g," ")}`,sub:"akumulasi tercatat"});
  if(cats.length) kpis.push({ic:"trash",c:"#2F6690",v:cats.length,l:"Jenis Sampah",sub:cats.slice(0,3).join(", ")+(cats.length>3?"…":"")});
  if(A.locCol){ const locs=[...new Set(rows.map(r=>r[A.locCol]).filter(Boolean))]; kpis.push({ic:"grid",c:"#173A2E",v:locs.length,l:"Lokasi Sumber",sub:"gardu/kantor"}); }

  const metric = A.weightCol ? (r=>snum(r[A.weightCol])) : (()=>1);
  const metricLabel = A.weightCol ? A.weightCol.replace(/_/g," ") : "jumlah catatan";

  let catAgg=[];
  if(A.catCol){ const map={}; rows.forEach(r=>{ const k=r[A.catCol]||"(kosong)"; map[k]=(map[k]||0)+metric(r); }); catAgg=Object.entries(map).sort((a,b)=>b[1]-a[1]); }
  let monAgg=[];
  if(A.dateCol){ const map={}; rows.forEach(r=>{ const k=monthKey(r[A.dateCol]); if(k)map[k]=(map[k]||0)+metric(r); }); monAgg=Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0])); }

  const showCols=A.cols;
  const tblRows=rows.slice(0,60);

  const charts_html = (catAgg.length||monAgg.length) ? `<div class="charts-row">
    ${catAgg.length?`<div class="panel"><h3>${icon("recycle",15)} Komposisi per Jenis (${escapeHtml(metricLabel)})</h3><div class="chart-box"><canvas id="c_sampahCat"></canvas></div></div>`:""}
    ${monAgg.length?`<div class="panel"><h3>${icon("trend",15)} Tren Bulanan (${escapeHtml(metricLabel)})</h3><div class="chart-box"><canvas id="c_sampahMon"></canvas></div></div>`:""}
  </div>`:"";

  const html = sampahShell(banner + `
    <div class="kpi-grid">
      ${kpis.map(k=>`<div class="kpi-card">
        <div class="kpi-icon" style="background:${k.c}1A;color:${k.c}">${icon(k.ic,16,2)}</div>
        <div><div class="kpi-value">${typeof k.v==="number"?fmt(k.v):k.v}</div><div class="kpi-label">${escapeHtml(k.l)}</div></div>
        ${k.sub?`<div class="kpi-sub">${escapeHtml(k.sub)}</div>`:""}
      </div>`).join("")}
    </div>
    ${charts_html}
    <div class="table-wrap"><table>
      <thead><tr>${showCols.map(c=>`<th class="${/berat|volume|massa|jumlah|kg|qty|bobot/i.test(c)?'num':''}">${escapeHtml(c.replace(/_/g," "))}</th>`).join("")}</tr></thead>
      <tbody>${tblRows.map(r=>`<tr>${showCols.map(c=>{
        const v=r[c];
        if(A.statusCol&&c===A.statusCol) return `<td>${sampahBadge(v)}</td>`;
        if(/berat|volume|massa|jumlah|kg|qty|bobot/i.test(c)) return `<td class="num">${v==null||v===""?"–":fmt1(snum(v))}</td>`;
        return `<td>${escapeHtml(v==null?"":String(v))}</td>`;

function barOpts(tip,legend,horizontal){ const o={responsive:true,maintainAspectRatio:false,indexAxis:horizontal?"y":"x",plugins:{legend:{display:!!legend,position:"bottom",labels:{usePointStyle:true,boxWidth:8,font:{size:11}}},tooltip:{callbacks:{label:c=>(c.dataset.label?c.dataset.label+": ":"")+(tip?tip(c.parsed[horizontal?"x":"y"]):c.formattedValue)}}},scales:{}}; const val={ticks:{callback:v=>v.toLocaleString("id-ID"),font:{size:10}},grid:{color:"#F0EEE2"}}; const cat={grid:{display:false},ticks:{font:{size:10}}}; if(horizontal){o.scales.x=val;o.scales.y=cat;}else{o.scales.y=val;o.scales.x=cat;} return o; }

/* ---------- SERTIFIKASI ---------- */
function certStatus(berlaku){
  const d=new Date(berlaku); if(isNaN(d)) return "Aktif";
  const now=new Date(); const in90=new Date(); in90.setDate(now.getDate()+90);
  if(d<now) return "Kadaluarsa";
  if(d<in90) return "Akan Berakhir";
  return "Aktif";
}
const CERT_STYLE={ "Aktif":["#E4EFE8","#2C6E63","check"], "Akan Berakhir":["#F6EBD8","#C98A2B","clock"], "Kadaluarsa":["#F5E1DB","#B5482E","xcircle"] };
function certBadge(st){ const [bg,fg,ic]=CERT_STYLE[st]||["#EEE","#666","clock"]; return `<span class="badge" style="background:${bg};color:${fg}">${icon(ic,12,2.4)}${st}</span>`; }
function fmtTgl(v){ const d=new Date(v); if(isNaN(d)) return escapeHtml(v||"–"); return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}); }
function initials(n){ return (n||"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?"; }

      ${kpis.map(k=>`<div class="kpi-card"><div class="kpi-icon" style="background:${k.c}1A;color:${k.c}">${icon(k.ic,16,2)}</div><div><div class="kpi-value">${k.v}</div><div class="kpi-label">${k.l}</div></div></div>`).join("")}
    </div>
    <div class="note">${icon("alert",15,2)}<div>Kolom foto bisa diisi tautan foto bukti pemasangan (opsional) — isi kolom "Foto (URL)" pada tab Dokumentasi_MSDS di spreadsheet.</div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Lokasi</th><th>Item Dokumentasi</th><th>Tanggal</th><th>Foto Bukti</th><th>Status</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><b>${escapeHtml(r.lokasi)}</b></td>
        <td>${escapeHtml(r.item)}</td>
        <td>${r.tanggal?fmtTgl(r.tanggal):"–"}</td>
        <td>${r.foto?`<a class="link-cell" href="${escapeHtml(r.foto)}" target="_blank" rel="noopener" style="color:var(--teal);text-decoration:none">${icon("external",12,2)} Lihat</a>`:"–"}</td>
        <td>${bdg(r.status)}</td></tr>`).join("")}</tbody>
    </table></div>
    ${sourceNote("dokmsds","Dokumentasi_MSDS")}`;
  return {html, draw:()=>{}};
}

const VIEWS={beranda,energi,program,air,gardu,sampah,sertifikasi,dokumen,medan,limbahb3,b3_daftar,b3_msds,lap_genset,lap_air,lap_sampah,lap_sf6,lap_b3};

render();
loadSheets();
if(CONFIG.SPREADSHEET_ID) setInterval(loadSheets, CONFIG.REFRESH_MINUTES*60000);
